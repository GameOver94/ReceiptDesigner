<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReceiptDesigner</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Material Theme Builder CSS exports (public/theme/).
         Swap these files to change the entire colour scheme without touching source code.
         The active scheme class is set on <html> above: "light" | "dark" | "light-hc" etc. -->
    <link rel="stylesheet" href="./theme/light.css" />
    <link rel="stylesheet" href="./theme/dark.css" />
    <link rel="stylesheet" href="./theme/light-mc.css" />
    <link rel="stylesheet" href="./theme/dark-mc.css" />
    <link rel="stylesheet" href="./theme/light-hc.css" />
    <link rel="stylesheet" href="./theme/dark-hc.css" />
  </head>
  <body>
    <!--
      Runtime configuration object injected before the app boots.
      In demo mode this is baked into the static HTML at build time.
      In production mode the FastAPI server replaces the APP_CONFIG comment below
      with a <script> that sets mode: 'production' before serving the file.

      Using window.__APP_CONFIG__ (rather than import.meta.env.VITE_*) lets the
      server override the mode at runtime without rebuilding the frontend bundle.
      See docs/design.md §3.1 for the full deployment mode explanation.
    -->
    <!--APP_CONFIG-->
    <script>
      // Demo mode default — overridden by the server in production mode.
      if (!window.__APP_CONFIG__) window.__APP_CONFIG__ = { mode: 'demo' };
    </script>

    <!-- The Svelte app mounts here -->
    <div id="app"></div>

    <!-- Vite injects the compiled app bundle here during build -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
