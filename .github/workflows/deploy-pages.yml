name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'

# Both jobs need these permissions for OIDC-based Pages deployment.
permissions:
  pages: write
  id-token: write

jobs:
  # ------------------------------------------------------------------
  # Re-run the full CI suite so the deploy is gated on a green build.
  # (The CI workflow only runs on branches; tags do not trigger it.)
  # ------------------------------------------------------------------
  ci:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build

      # Upload the dist/ produced in this job so the deploy job can
      # consume it without rebuilding.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # ------------------------------------------------------------------
  # Deploy only after CI (lint + typecheck + build) passes.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: [ci]
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
